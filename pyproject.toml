[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-locomotion"
version = "0.1.0"
description = "Unitree G1 locomotion and projectile-catching tasks for NVIDIA Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "G1 Locomotion contributors" }]

[project.optional-dependencies]
sim2sim = [
    "mujoco>=3.2,<4",
    "numpy>=1.26",
    "torch>=2.3",
]

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]
